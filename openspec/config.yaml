schema: spec-driven

# Короткий контекст, который добавляется при генерации каждого артефакта.
context: |
  Продукт: KKD Service — Java backend-сервис для контроля качества данных
  по целям и ключевым результатам сотрудников. Сервис анализирует данные
  PostgreSQL, сохраняет результаты проверок и предоставляет REST API
  для визуализации метрик и динамики качества данных.

  Стек: Java 21, Spring Boot 3.5.16, Maven, PostgreSQL 15+,
  Spring Data JPA, Liquibase, JUnit 5, Docker Compose.

  Если описание в openspec/context/_raw/ расходится с актуальным кодом,
  ориентируйся на код, а противоречия выноси на согласование с человеком.

  Перед созданием ЛЮБОГО артефакта обязательно прочитай:
  - openspec/context/00-start-here.md
  - openspec/context/01-product-context.md
  - openspec/context/02-domain-glossary.md
  - openspec/context/04-engineering-standards.md
  - openspec/context/05-security-and-compliance.md
  - openspec/context/07-anti-patterns.md

  Если нужного контекста не хватает — НЕ угадывай, явно сформулируй,
  какой информации не хватает.

# Правила для отдельных типов артефактов.
rules:
  proposal:
    - Всегда заполняй Scope и Non-goals.
    - Не выходи за пределы согласованного Scope.
    - Противоречия требований выноси на согласование с человеком.

  specs:
    - Если описание в _raw расходится с актуальным кодом, ориентируйся на код и подними вопрос.
    - Формулируй требования проверяемо, используя Given/When/Then.
    - Не превращай предположения в подтвержденные бизнес-требования.

  design:
    - Опирайся на архитектурные инварианты из 03-architecture.md.
    - Учитывай решения из openspec/context/ADR/.
    - Объясняй значимые технические решения и альтернативы.

  tasks:
    - Не делай рефакторинг вне согласованной задачи.
    - Учитывай запреты из 07-anti-patterns.md.
    - Каждая задача должна иметь проверяемые критерии приёмки.
