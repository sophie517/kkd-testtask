schema: spec-driven

context: |
  KKD Service: небольшой Java backend для контроля качества целей и КР.
  Главный источник требований: openspec/context/_raw/business-assignment.md.
  Код не имеет приоритета над заданием. Числовой пример исходного задания
  иллюстрирует формат; согласованные примеры — openspec/context/examples/README.md.

  Перед планированием или реализацией прочитай openspec/context/00-start-here.md
  и контекстные файлы 01–07, ADR/001-validation-engine-separation.md.
  Они различают требования задания и простые решения проекта.
  Пробелы заполняй минимальными решениями и фиксируй их как решения, не как цитаты задания.

  Стек: Java 21, Spring Boot 3.5.16, Maven, PostgreSQL 15+,
  Spring Data JPA, Liquibase YAML, JUnit 5.
  Четыре правила: GOAL_NO_OWNER, GOAL_NO_KR, KR_WEIGHTS_SUM, CASCADE_NO_PARENT.
  Вес — BigDecimal в процентах, сумма ровно 100.00.
  История читается из снимков подразделений, активных целей и проблем.
  Три бизнес-GET endpoint; Swagger UI и /v3/api-docs документируют API.
  Lombok для getters/конструкторов добавлен по запросу пользователя.
  Без авторизации, CRUD и планировщика.
  Все семь этапов реализованы. Полная приёмка выполнена 2026-11-08:
  62 теста без ошибок и пропусков, два чистых Docker-стенда, реальный HTTP,
  PostgreSQL constraints/cascades, REPEATABLE_READ и атомарный rollback RunService,
  полный Liquibase update/rollback/update с совпадением схемы и всех demo-данных.
  Результаты: docs/verification.md; команды: README.md; история работы: AI-PLAN.md.
  Шесть основных capability синхронизированы в openspec/specs.
  Семь этапов описаны в openspec/context/08-delivery-stages.md.
  Новый scope требует отдельного запроса пользователя и change.
  Перед началом учитывай результаты зависимостей; при изменении контракта
  обнови затронутые последующие планы до их реализации.

rules:
  proposal:
    - Укажи Scope и Non-goals; не добавляй функции сверх задания и контекста.
  specs:
    - Различай требования задания и решения проекта.
    - Не меняй требования под текущий код; используй проверяемые сценарии.
  design:
    - Выбирай простейший вариант, который сохраняет историческую корректность.
    - Учитывай определения правил, API и null-семантику из контекста.
  tasks:
    - Не отмечай задачу выполненной до проверки поведения.
    - Включай тесты вместе с логикой, а проверку rollback — вместе с миграциями.
