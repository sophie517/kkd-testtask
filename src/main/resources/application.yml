spring:
  application:
    name: kkd-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkd_db}
    username: ${DB_USERNAME:kkd}
    password: ${DB_PASSWORD:kkd}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.yml
