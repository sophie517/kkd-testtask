spring:
  application:
    name: kkd-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkd}
    username: ${DB_USERNAME:kkd}
    password: ${DB_PASSWORD:kkd}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yml
